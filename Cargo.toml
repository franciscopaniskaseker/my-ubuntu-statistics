[package]
name = "hwstats"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local hardware statistics dashboard with history"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
libc = "0.2.191"
nvml-wrapper = "0.13.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = false
strip = "debuginfo"
